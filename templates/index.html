<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Email Generator</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="  https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-gradient-to-r from-blue-100/50 via-purple-100/30 to-pink-100/50 backdrop-blur-lg min-h-screen flex items-center justify-center p-6">

  <!-- Top Nav -->
  <nav class="absolute top-4 left-6">
    <a href="/" class="insight-logo text-4xl font-extrabold tracking-wide bg-clip-text text-transparent
       bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 drop-shadow-md hover:opacity-80 transition-opacity duration-200">
      InsightOutreach
    </a> 
  </nav>

  <!-- Main Container -->
  <div class="w-full max-w-xl flex flex-col items-center"> <!-- Added flex-col and items-center -->

    <!-- Loader with dynamic status - Moved outside input section -->
    <div id="loader" class="hidden mb-8 flex flex-col items-center w-full"> <!-- Added mb-8 for spacing and w-full -->
      <div class="w-12 h-12 border-4 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
      <p id="status-text" class="text-gray-700 mt-4 font-medium">Starting...</p>
    </div>

    <!-- Input Section -->
   <div id="input-section">
    <h1 class="text-3xl font-bold mb-6 text-center">AI-Powered Cold Email Generator</h1>
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <div class="mb-4">
            <label for="analysis-id" class="block text-gray-700 text-sm font-bold mb-2">Analysis ID:</label>
            <input type="text" id="analysis-id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- NEW: Designation input field -->
        <div class="mb-4">
            <label for="designation" class="block text-gray-700 text-sm font-bold mb-2">Recipient Designation:</label>
            <select id="designation" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Select Designation</option>
                <option value="CEO">CEO</option>
                <option value="Co-Founder">Co-Founder</option>
                <option value="Marketing Manager">Marketing Manager</option>
                <option value="Chief Revenue Officer">Chief Revenue Officer</option>
                <option value="Executive Director">Executive Director</option>
                <option value="Chief Strategy Officer (CSO)">Chief Strategy Officer (CSO)</option>
                <option value="Chief Operating Officer (COO)">Chief Operating Officer (COO)</option>
                <option value="Chief Financial Officer">Chief Financial Officer</option>
                <option value="CTO">CTO</option>

            </select>
        </div>
        <button id="generate-btn" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Generate
        </button>
    </div>
</div>

    <!-- Email Output Section -->
    <div id="emails-section" class="w-full mt-6 hidden"></div>

  </div> <!-- End Main Container -->

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
